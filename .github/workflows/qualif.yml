# Qualification : sur chaque PR vers qualif ou main (et à la demande).
# Vérifie Autoroute « comme un utilisateur » : paquet construit, installé hors du dépôt,
# commandes testées, puis vraies API (après approbation, avec les secrets GitHub).
name: qualif

on:
  pull_request:
    branches: [qualif, main]
  workflow_dispatch:

concurrency:
  group: qualif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # « pip install -e . » lit les fichiers du dépôt : il ne voit pas un paquet incomplet.
    # Ici, on installe le wheel construit, dans un environnement neuf, hors du dépôt.
    name: paquet installé (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Construire le paquet
        run: uv build

      - name: Vérifier les métadonnées (README, licence) pour PyPI
        run: uvx twine check --strict dist/*

      - name: Installer le wheel dans un environnement neuf
        run: |
          uv venv "$RUNNER_TEMP/clean"
          VIRTUAL_ENV="$RUNNER_TEMP/clean" uv pip install dist/*.whl

      - name: Tester les commandes, depuis un dossier vide
        working-directory: ${{ runner.temp }}
        run: |
          BIN="$RUNNER_TEMP/clean/bin"
          [ -d "$RUNNER_TEMP/clean/Scripts" ] && BIN="$RUNNER_TEMP/clean/Scripts"
          mkdir smoke && cd smoke

          "$BIN/autoroute" --help
          "$BIN/python" -c "import autoroute; print(autoroute.__all__)"

          # Les templates doivent être dans le paquet.
          "$BIN/autoroute" init
          test -f .autoroute/config.yaml
          test -f .env.example

          # Sans clé : erreur propre (code 1), jamais de trace Python.
          set +e
          out=$("$BIN/autoroute" models 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          ! echo "$out" | grep -q Traceback

  live:
    # L'environment « qualification » exige ton approbation et contient les clés API.
    name: vraies API
    needs: package
    runs-on: ubuntu-latest
    environment: qualification
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests sur les vraies API
        run: pytest -m live -v -s

  qualif-ok:
    # Seul check à exiger dans la protection des branches (voir tests-ok dans tests.yml).
    name: qualif OK
    if: always()
    needs: [package, live]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les jobs ont réussi
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
