# Publication : sur un tag de version (ex. v0.1.1), créé sur main.
#
# Toujours : vérifications, paquet construit, Release GitHub avec le wheel
#            (installable par « pip install <url du wheel> »).
# Si la variable de dépôt PUBLISH_PYPI vaut "true" (Settings → Variables) :
#            TestPyPI d'abord, test d'installation, puis PyPI après ton approbation.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    name: vérifications du tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet, pour vérifier que le tag est sur main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Le tag correspond à la version de pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject.toml : $version / tag : ${GITHUB_REF_NAME}"
          test "v$version" = "${GITHUB_REF_NAME}"

      - name: Le tag est sur main (code entré par une PR qualifiée)
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    name: paquet
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Release GitHub
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Créer la Release avec le wheel et l'archive source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes

  testpypi:
    # Publication sans token : « Trusted Publishing » à configurer une fois sur test.pypi.org.
    name: TestPyPI
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-install:
    name: installation depuis TestPyPI
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer la version publiée et tester les commandes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Les dépendances (LangChain...) viennent du vrai PyPI, Autoroute de TestPyPI.
          # Quelques essais : l'index de TestPyPI met parfois une minute à se mettre à jour.
          for i in 1 2 3 4 5; do
            pip install --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ "autoroute-ai==$version" && break
            sleep 30
          done
          mkdir smoke && cd smoke
          autoroute --help
          autoroute init
          test -f .autoroute/config.yaml

  pypi:
    # L'environment « pypi » exige ton approbation : dernière vérification avant publication.
    name: PyPI
    needs: testpypi-install
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
