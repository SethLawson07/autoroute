<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#222">
  <title>How Autoroute works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- White background: readable in dark theme too -->
  <rect x="0" y="0" width="860" height="330" rx="12" fill="#ffffff"/>

  <!-- Autoroute frame -->
  <rect x="180" y="20" width="660" height="130" rx="10" fill="#eef4ff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="195" y="42" font-weight="600" fill="#4a6fa5">Autoroute</text>

  <!-- User application frame -->
  <rect x="420" y="190" width="240" height="115" rx="10" fill="#f0faf3" stroke="#4a8a5c" stroke-width="1.5"/>
  <text x="435" y="212" font-weight="600" fill="#4a8a5c">Your application</text>

  <g fill="#ffffff" stroke="#555" stroke-width="1.2">
    <rect x="20" y="60" width="130" height="60" rx="8"/>
    <rect x="200" y="60" width="170" height="60" rx="8"/>
    <rect x="400" y="60" width="200" height="60" rx="8"/>
    <rect x="630" y="60" width="190" height="60" rx="8"/>
    <rect x="180" y="225" width="220" height="60" rx="8"/>
    <rect x="435" y="225" width="210" height="60" rx="8"/>
    <!-- Log (cylinder) -->
    <path d="M740,220 v65 a50,10 0 0 0 100,0 v-65"/>
    <ellipse cx="790" cy="220" rx="50" ry="10"/>
  </g>

  <g text-anchor="middle">
    <text x="85" y="95">Your prompt</text>
    <text x="285" y="95" font-family="Consolas, Menlo, monospace">route(prompt)</text>
    <text x="500" y="86">Models discovered</text>
    <text x="500" y="106">with your API keys</text>
    <text x="725" y="86">The orchestrator</text>
    <text x="725" y="106">picks</text>
    <text x="290" y="250" font-family="Consolas, Menlo, monospace">provider:name</text>
    <text x="290" y="270">+ fallbacks</text>
    <text x="540" y="250">Calls the chosen</text>
    <text x="540" y="270">model</text>
    <text x="790" y="254" font-family="Consolas, Menlo, monospace" font-size="12">.autoroute/</text>
    <text x="790" y="270" font-family="Consolas, Menlo, monospace" font-size="12">log.jsonl</text>
    <text x="700" y="242" font-family="Consolas, Menlo, monospace" font-size="12">r.tracker()</text>
  </g>

  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M150,90 H198"/>
    <path d="M370,90 H398"/>
    <path d="M600,90 H628"/>
    <path d="M680,120 V175 H290 V223"/>
    <path d="M785,120 V208"/>
    <path d="M400,255 H433"/>
    <path d="M645,255 H738" stroke-dasharray="5,4"/>
  </g>
</svg>
